name: Lab PDF reports

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  report:
    name: Lab ${{ matrix.lab }} PDF
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lab: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install XeLaTeX and Cyrillic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            fonts-dejavu-core

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::fpp3
            any::USgas
            any::readxl
            any::e1071
            any::nortest
            any::seasonal
            any::rmarkdown
          cache-version: lab-pdf-1

      - name: Render PDF
        run: Rscript scripts/render-lab-pdf.R ${{ matrix.lab }}

      - uses: actions/upload-artifact@v4
        with:
          name: lab${{ matrix.lab }}-report
          path: reports/lab${{ matrix.lab }}.pdf
          if-no-files-found: error
